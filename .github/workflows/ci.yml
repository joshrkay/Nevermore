name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]

# A newer push to the same pull request supersedes the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The front end: the same four commands as
  # `npm run lint && npm run typecheck:functions && npm test && npm run build`.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Tests only load the function modules they import, and Vitest does not type-check, so a
      # function whose entry point cannot load (a duplicate declaration, an undefined name, a bad
      # import) would otherwise pass every other check.
      - run: npm run typecheck:functions
      - run: npm test
      - run: npm run build

  # Access control lives in the database, so its tests run against a real Postgres.
  # Each file in supabase/tests runs in its own fresh database (see supabase/tests/run.sh).
  sql-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: supabase/tests/run.sh
