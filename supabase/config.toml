project_id = "bspdkpwziixcastxxpqv"

# Called by the email provider, which holds no Supabase login: the function checks the webhook's own
# signature (RESEND_WEBHOOK_SECRET) instead of a JWT. See docs/NOTIFICATIONS.md.
[functions.resend-webhook]
verify_jwt = false

# Called by the email provider for mail sent to a quote request's reply address, which holds no Supabase login:
# the function checks the webhook's own signature (RESEND_INBOUND_WEBHOOK_SECRET) instead of a JWT.
[functions.receive-mail]
verify_jwt = false

# The page a PEO opens from an advisor's send (/b/<token>, ADR 0003), with no sign-in: the function answers only a live link's
# token, which it hashes before asking the database as the service role.
[functions.bundle-link]
verify_jwt = false

# A file link on a message to a contact (/f#<token>, D-605), with no sign-in: the function answers only a live link's token, which it hashes before
# asking the database as the service role.
[functions.message-file]
verify_jwt = false

# The "contact me" form on a firm's public link (slice 8.7b): a visitor signs in nowhere. The function checks a Cloudflare Turnstile token (TURNSTILE_SECRET_KEY)
# instead of a JWT, then asks the database as the service role; with no secret it refuses everyone.
[functions.contact-request]
verify_jwt = false
